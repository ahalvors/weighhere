[build]
  command = "python3 build.py && python3 tools/add_canonicals.py"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/los-angeles"
  to = "/los-angeles/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
